# Comprehensive optimization configuration examples
# This file demonstrates all supported optimization approaches

# =============================================================================
# SINGLE OBJECTIVE OPTIMIZATION
# =============================================================================

study:
  name: "maximize_throughput_example"

optimization:
  # Balanced optimization: Find best throughput vs latency trade-offs
  approach: "multi_objective"
  objectives:
    - metric: "output_tokens_per_second"  # Maximize throughput
      direction: "maximize"
      percentile: "median"
    - metric: "request_latency"  # Minimize latency
      direction: "minimize"
      percentile: "median"
  sampler: "random"  # Fast for testing (use nsga2 for real optimization)
  n_trials: 11       # Small number for quick test

# Example 2: Minimize E2E Latency
# optimization:
#   approach: "single_objective"
#   objective:
#     metric: "request_latency"
#     direction: "minimize"
#     percentile: "p95"  # Optimize for 95th percentile latency
#   sampler: "tpe"
#   n_trials: 100

# Example 3: Minimize TTFT (Time To First Token)
# optimization:
#   approach: "single_objective"
#   objective:
#     metric: "time_to_first_token_ms"
#     direction: "minimize"
#     percentile: "median"
#   sampler: "tpe"
#   n_trials: 100

# Example 4: Minimize Inter-Token Latency
# optimization:
#   approach: "single_objective"
#   objective:
#     metric: "inter_token_latency_ms"
#     direction: "minimize"
#     percentile: "p95"
#   sampler: "tpe"
#   n_trials: 100

# =============================================================================
# MULTI-OBJECTIVE OPTIMIZATION
# =============================================================================

# Example 5: Throughput vs TTFT Trade-off
# optimization:
#   approach: "multi_objective"
#   objectives:
#     - metric: "output_tokens_per_second"
#       direction: "maximize"
#       percentile: "median"
#     - metric: "time_to_first_token_ms"
#       direction: "minimize"
#       percentile: "p95"
#   sampler: "nsga2"  # Recommended for multi-objective
#   n_trials: 200

# Example 6: Throughput vs E2E Latency Trade-off (current default multi-objective)
# optimization:
#   approach: "multi_objective"
#   objectives:
#     - metric: "output_tokens_per_second"
#       direction: "maximize"
#       percentile: "median"
#     - metric: "request_latency"
#       direction: "minimize"
#       percentile: "median"
#   sampler: "nsga2"
